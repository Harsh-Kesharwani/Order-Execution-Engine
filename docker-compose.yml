services:
  redis:
    image: redis:7
    ports: [ "6379:6379" ]
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_pass
      POSTGRES_DB: orders_db
    ports: [ "5432:5432" ]
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
